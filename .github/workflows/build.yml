name: Build and publish

# Builds the housing tracker and publishes it to this repo's gh-pages branch, which GitHub Pages serves at
# buildhousing.org. The cities update their lists every few weeks or months, so it rebuilds every six hours
# (the build checks when it last ran, from the projects.json it published), or at once after a push or a
# "Run workflow".
on:
  push:
    branches: [main]
  schedule:
    # Hourly, at an odd minute: GitHub drops many scheduled runs at :00, and an hourly check means a dropped
    # run costs an hour, not six.
    - cron: "41 * * * *"
  workflow_dispatch:

permissions:
  contents: write  # To push the built site to gh-pages, and the keep-alive's empty commit to main.

# One run at a time. A push cancels a run in progress, since it brings newer code; a scheduled run waits.
concurrency:
  group: build
  cancel-in-progress: ${{ github.event_name == 'push' }}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      # The readers against saved samples of their sources; a change that breaks one isn't published.
      - run: python3 -m unittest
      - run: python3 -m housing.build
        env:
          # Empty means build now. (In GitHub's `a && b || c`, b can't be empty, so the condition is inverted.)
          HOUSING_EVERY_HOURS: ${{ github.event_name == 'schedule' && '6' || '' }}
      - name: Publish
        if: hashFiles('dist/housing/index.html') != ''
        env:
          TOKEN: ${{ github.token }}
        run: |
          # The branch is replaced with one new commit each time, so the repo doesn't grow with every build.
          echo buildhousing.org > dist/housing/CNAME
          touch dist/housing/.nojekyll
          cd dist/housing
          git init -q -b gh-pages
          git add -A
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
            commit -qm "Housing tracker, built from ${GITHUB_SHA::7}"
          git push -qf "https://x-access-token:${TOKEN}@github.com/${GITHUB_REPOSITORY}.git" gh-pages

  # GitHub turns off scheduled workflows after 60 days without a commit, which would freeze the site. If the
  # repo has been quiet for 50 days, an empty commit to main resets that clock.
  keepalive:
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - run: |
          if [ $(( $(date +%s) - $(git log -1 --format=%ct) )) -gt $(( 50 * 86400 )) ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit --allow-empty -m "Keep the scheduled build running"
            git push
          fi
